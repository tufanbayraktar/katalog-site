<!DOCTYPE html>

<html lang="de">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>FreshMaximum</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
margin:0;
font-family:Inter;
background:#f6f7f9;
touch-action:manipulation;
}

/* HEADER */

.header{
background:#16a34a;
color:white;
padding:18px;
text-align:center;
font-size:22px;
font-weight:700
}

/* SEARCH */

.searchbar{
padding:10px;
background:white
}

.searchbar input{
width:100%;
padding:12px;
border-radius:10px;
border:none;
background:#eef0f2
}

/* CATEGORY */

.categories{
display:flex;
gap:8px;
overflow-x:auto;
padding:10px;
background:white;
position:sticky;
top:0;
z-index:10
}

.cat{
background:#f1f1f1;
padding:8px 12px;
border-radius:20px;
cursor:pointer;
font-weight:600
}

/* BESTSELLER */

.bestseller{
padding:10px
}

.bestseller h3{
margin:6px 0
}

/* GRID */

.products{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
padding:12px
}

.card{
background:white;
border-radius:16px;
padding:10px;
position:relative;
box-shadow:0 4px 8px rgba(0,0,0,0.08)
}

.card img{
width:100%;
height:120px;
border-radius:12px;
object-fit:cover
}

.name{
font-weight:700
}

.brand{
font-size:13px;
color:#555
}

.price{
color:#16a34a;
font-weight:700
}

.add{
position:absolute;
bottom:10px;
right:10px;
background:#16a34a;
color:white;
border:none;
width:32px;
height:32px;
border-radius:50%
}

.fav{
position:absolute;
top:10px;
right:10px;
font-size:18px;
cursor:pointer
}

/* CART */

.cartbar{
position:fixed;
bottom:-70px;
left:10px;
right:10px;
background:#16a34a;
color:white;
padding:14px;
border-radius:14px;
display:flex;
justify-content:space-between;
transition:0.3s
}

.cartbar.active{
bottom:10px
}

.cartpanel{
position:fixed;
inset:0;
background:white;
transform:translateY(100%);
transition:0.3s;
overflow:auto;
padding:20px
}

.cartpanel.active{
transform:translateY(0)
}

.cartitem{
display:flex;
justify-content:space-between;
align-items:center;
padding:10px;
background:#f2f2f2;
margin-bottom:6px;
border-radius:8px
}

.qty button{
width:28px;
height:28px;
border:none;
background:#16a34a;
color:white;
border-radius:6px
}

/* DETAIL */

.detail{
position:fixed;
inset:0;
background:white;
transform:translateY(100%);
transition:0.3s;
overflow:auto;
padding:20px
}

.detail.active{
transform:translateY(0)
}

/* ADMIN */

.admin{
position:fixed;
bottom:90px;
right:10px;
background:black;
color:white;
padding:10px;
border-radius:10px
}

.panel{
position:fixed;
inset:0;
background:white;
transform:translateY(100%);
transition:0.3s;
overflow:auto;
padding:20px
}

.panel.active{
transform:translateY(0)
}

input,select,textarea{
width:100%;
padding:10px;
margin-bottom:8px;
border-radius:8px;
border:1px solid #ddd
}

button{
padding:10px;
border:none;
border-radius:10px;
background:#16a34a;
color:white
}

.delete{
background:red
}

.productrow{
display:flex;
justify-content:space-between;
background:#f2f2f2;
padding:8px;
margin-top:6px;
border-radius:8px
}

.stat{
background:#f2f2f2;
padding:10px;
border-radius:10px;
margin-top:10px
}

</style>

</head>

<body>

<div class="header">FreshMaximum</div>

<div class="searchbar">
<input placeholder="Suchen..." onkeyup="searchProducts(this.value)">
</div>

<div class="categories">
<div class="cat" onclick="scrollCategory('all')">Alle</div>
<div class="cat" onclick="scrollCategory('Obst')">Obst</div>
<div class="cat" onclick="scrollCategory('Gemüse')">Gemüse</div>
<div class="cat" onclick="showFavorites()">Favoriten</div>
</div>

<div class="bestseller">
<h3>🔥 Bestseller</h3>
<div id="bestseller"></div>
</div>

<div class="products" id="productList"></div>

<div class="cartbar" id="cartbar" onclick="openCart()">
<span>Warenkorb</span>
<span id="cartcount">0</span>
</div>

<div class="cartpanel" id="cartpanel">

<h2>Ihr Warenkorb</h2>

<div id="cartitems"></div>

<h3 id="total">Total: 0 €</h3>

<button onclick="sendOrder()">WhatsApp Bestellung</button>

</div>

<div class="detail" id="detail"></div>

<div class="admin" onclick="adminLogin()">ADMIN</div>

<div class="panel" id="adminpanel">

<h2>Produkt hinzufügen</h2>

<input id="pname" placeholder="Produktname">
<input id="pbrand" placeholder="Marke">
<input id="porigin" placeholder="Herkunft">
<input id="pcontent" placeholder="Inhalt">
<textarea id="pdesc" placeholder="Beschreibung"></textarea>

<input id="pprice" placeholder="Preis €">
<input id="pstock" placeholder="Stock">

<select id="pcat">
<option value="Obst">Obst</option>
<option value="Gemüse">Gemüse</option>
</select>

<input type="file" id="pimg" accept="image/*">

<button onclick="addProduct()">Produkt speichern</button>

<h3>Produkte</h3>
<div id="adminlist"></div>

<h3>Dashboard</h3>
<div class="stat" id="orders"></div>
<div class="stat" id="revenue"></div>
<canvas id="chart"></canvas>

</div>

<script>

/* ZOOM ENGELLE */

document.addEventListener('gesturestart', e=>e.preventDefault())

/* DATA */

let products=JSON.parse(localStorage.getItem("products"))||[]
let favorites=JSON.parse(localStorage.getItem("favorites"))||[]
let orders=JSON.parse(localStorage.getItem("orders"))||[]
let cart=[]

function save(){
localStorage.setItem("products",JSON.stringify(products))
localStorage.setItem("favorites",JSON.stringify(favorites))
localStorage.setItem("orders",JSON.stringify(orders))
}

/* RENDER */

function render(){

productList.innerHTML=""

products.forEach((p,i)=>{

let fav=favorites.includes(p.name)?"❤️":"🤍"

let div=document.createElement("div")
div.className="card"
div.dataset.cat=p.category

div.innerHTML=`

<span class="fav" onclick="toggleFav('${p.name}')">${fav}</span>

<img src="${p.img}" onclick="openDetail(${i})">

<div class="name">${p.name}</div>
<div class="brand">${p.brand}</div>
<div class="price">${p.price} €</div>

<button class="add" onclick="addCart(${i})">+</button>
`

productList.appendChild(div)

})

renderAdmin()
renderBest()

}

/* BESTSELLER */

function renderBest(){

let sales={}

orders.forEach(o=>{
o.forEach(i=>{
sales[i.name]=(sales[i.name]||0)+1
})
})

let sorted=Object.entries(sales).sort((a,b)=>b[1]-a[1]).slice(0,4)

bestseller.innerHTML=""

sorted.forEach(s=>{

let p=products.find(x=>x.name===s[0])

if(!p)return

let div=document.createElement("div")
div.innerHTML=p.name+" ⭐"
bestseller.appendChild(div)

})

}

/* CATEGORY SCROLL */

function scrollCategory(cat){

if(cat==="all"){
window.scrollTo({top:0,behavior:"smooth"})
return
}

let el=[...document.querySelectorAll(".card")].find(c=>c.dataset.cat===cat)

if(el) el.scrollIntoView({behavior:"smooth"})

}

/* FAVORITES */

function toggleFav(name){

if(favorites.includes(name)){
favorites=favorites.filter(f=>f!==name)
}else{
favorites.push(name)
}

save()
render()

}

function showFavorites(){

productList.innerHTML=""

products.filter(p=>favorites.includes(p.name)).forEach((p,i)=>{

let div=document.createElement("div")
div.className="card"

div.innerHTML=`
<img src="${p.img}">
<div class="name">${p.name}</div>
<div class="price">${p.price} €</div>
<button class="add" onclick="addCart(${i})">+</button>
`

productList.appendChild(div)

})

}

/* SEARCH */

function searchProducts(q){

q=q.toLowerCase()

document.querySelectorAll(".card").forEach(c=>{
c.style.display=c.innerText.toLowerCase().includes(q)?"block":"none"
})

}

/* CART */

function addCart(i){

let item=cart.find(c=>c.index===i)

if(item){
item.qty++
}else{
cart.push({index:i,qty:1})
}

cartcount.innerText=cart.length

cartbar.classList.add("active")

renderCart()

}

function renderCart(){

cartitems.innerHTML=""

let total=0

cart.forEach((c,i)=>{

let p=products[c.index]

total+=p.price*c.qty

let div=document.createElement("div")
div.className="cartitem"

div.innerHTML=`
${p.name}
<div class="qty">
<button onclick="changeQty(${i},-1)">-</button>
${c.qty}
<button onclick="changeQty(${i},1)">+</button>
</div>
`

cartitems.appendChild(div)

})

document.getElementById("total").innerText="Total: "+total+" €"

}

/* ORDER */

function sendOrder(){

orders.push(cart.map(c=>({name:products[c.index].name,qty:c.qty})))

save()

let msg="FreshMaximum Bestellung:%0A"

cart.forEach(c=>{
let p=products[c.index]
msg+=p.name+" x"+c.qty+"%0A"
})

window.open("https://wa.me/491727117489?text="+msg)

updateStats()

}

/* ADMIN */

function adminLogin(){

let pass=prompt("Admin Passwort")

if(pass!=="1234")return

adminpanel.classList.add("active")

updateStats()

}

function addProduct(){

let file=pimg.files[0]

let reader=new FileReader()

reader.onload=function(){

products.push({
name:pname.value,
brand:pbrand.value,
origin:porigin.value,
content:pcontent.value,
desc:pdesc.value,
price:parseFloat(pprice.value),
stock:pstock.value,
category:pcat.value,
img:reader.result
})

save()
render()

}

reader.readAsDataURL(file)

}

function deleteProduct(i){

products.splice(i,1)

save()
render()

}

function renderAdmin(){

adminlist.innerHTML=""

products.forEach((p,i)=>{

let div=document.createElement("div")
div.className="productrow"

div.innerHTML=`
${p.name}
<button class="delete" onclick="deleteProduct(${i})">Sil</button>
`

adminlist.appendChild(div)

})

}

/* DASHBOARD */

function updateStats(){

orders.innerText="Bestellungen: "+orders.length

let revenue=orders.length*10

revenue.innerText="Umsatz: "+revenue+" €"

let ctx=document.getElementById("chart")

new Chart(ctx,{
type:"bar",
data:{
labels:["Bestellungen"],
datasets:[{data:[orders.length]}]
}
})

}

render()

</script>

</body>
</html>
