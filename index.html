<!DOCTYPE html>

<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>FreshMaximum</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>

*{box-sizing:border-box}

body{
margin:0;
font-family:'Inter',sans-serif;
background:#f4f6f8;
overflow-x:hidden;
touch-action:manipulation;
}

/* TOP */

.topbar{
display:flex;
gap:10px;
padding:15px;
align-items:center;
}

.back{
font-size:22px;
display:none;
cursor:pointer;
}

.search{
flex:1;
height:45px;
border-radius:25px;
border:none;
padding:0 15px;
background:#e6e9ed;
}

/* LOGO */

.logo-area{
text-align:center;
padding:25px;
}

.logo-card{
background:white;
display:inline-block;
padding:25px;
border-radius:25px;
box-shadow:0 8px 20px rgba(0,0,0,0.08);
}

.logo-card img{
height:100px;
}

.brand{
font-size:28px;
font-weight:700;
margin-top:10px;
}

/* CATEGORIES */

.categories{
padding:20px;
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
}

.cat{
background:white;
border-radius:20px;
padding:10px;
box-shadow:0 8px 20px rgba(0,0,0,0.08);
cursor:pointer;
}

.cat img{
width:100%;
height:120px;
object-fit:cover;
border-radius:15px;
}

.cat-title{
text-align:center;
font-weight:600;
margin-top:8px;
}

/* PRODUCTS */

.products{
display:none;
padding:20px;
}

.card{
background:white;
border-radius:20px;
padding:15px;
box-shadow:0 8px 20px rgba(0,0,0,0.08);
margin-bottom:20px;
}

.card img{
width:100%;
border-radius:15px;
cursor:pointer;
}

.name{
text-align:center;
font-size:24px;
font-weight:700;
margin-top:10px;
}

.price{
text-align:center;
color:#16a34a;
font-weight:700;
}

/* MODAL */

.modal{
position:fixed;
inset:0;
background:white;
transform:translateY(100%);
transition:0.4s;
z-index:999;
overflow:auto;
}

.modal.active{
transform:translateY(0);
}

.modal-header{
position:relative;
padding:20px;
}

.close{
position:absolute;
right:20px;
top:20px;
width:40px;
height:40px;
border-radius:50%;
background:#eee;
display:flex;
align-items:center;
justify-content:center;
font-size:20px;
cursor:pointer;
}

.modal img{
width:100%;
border-radius:20px;
}

.modal-body{
padding:20px;
}

.modal-title{
font-size:30px;
font-weight:700;
}

.stock{
color:#888;
margin-bottom:10px;
}

.qty{
display:flex;
align-items:center;
gap:10px;
margin-bottom:15px;
}

.qty button{
width:35px;
height:35px;
border:none;
border-radius:50%;
background:#16a34a;
color:white;
font-size:18px;
}

/* BUTTON */

.cart-btn{
width:100%;
background:#16a34a;
color:white;
padding:16px;
border:none;
border-radius:15px;
font-size:18px;
font-weight:600;
}

/* DESC */

.desc-title{
margin-top:20px;
padding:15px;
background:#f4f6f8;
border-radius:12px;
display:flex;
justify-content:space-between;
cursor:pointer;
}

.desc-card{
margin-top:10px;
padding:15px;
background:white;
border-radius:12px;
box-shadow:0 5px 10px rgba(0,0,0,0.08);
display:none;
}

/* CART BAR */

.cart-bar{
position:fixed;
bottom:-100px;
left:20px;
right:20px;
background:#16a34a;
color:white;
padding:15px;
border-radius:20px;
display:flex;
justify-content:space-between;
align-items:center;
transition:0.4s;
}

.cart-bar.active{
bottom:20px;
}

.count{
background:white;
color:#16a34a;
width:28px;
height:28px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
}

/* CART SCREEN */

.cart-screen{
position:fixed;
inset:0;
background:white;
transform:translateY(100%);
transition:0.4s;
z-index:1000;
padding:20px;
overflow:auto;
}

.cart-screen.active{
transform:translateY(0);
}

.cart-item{
background:#f4f6f8;
padding:15px;
border-radius:12px;
margin-bottom:10px;
display:flex;
justify-content:space-between;
}

/* ADMIN */

.admin{
position:fixed;
right:10px;
bottom:110px;
background:black;
color:white;
padding:10px;
border-radius:10px;
font-size:12px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="topbar">
<div class="back" id="backBtn" onclick="goBack()">←</div>
<input class="search" placeholder="Suchen" onkeyup="searchProducts(this.value)">
</div>

<div class="logo-area" id="logoArea">

<div class="logo-card">
<img src="https://i.postimg.cc/qMnCrzdm/Fresh-Maximum-Logo.png">
</div>

<div class="brand">FreshMaximum</div>

</div>

<div class="categories" id="categories">

<div class="cat" onclick="openCategory()">
<img src="https://i.postimg.cc/tTCc6sjr/Ekran-goruntusu-2026-02-20-165607.png">
<div class="cat-title">Obst</div>
</div>

<div class="cat">
<img src="https://i.postimg.cc/MHBg6hxj/Ekran-goruntusu-2026-02-20-165736.png">
<div class="cat-title">Gemüse</div>
</div>

</div>

<div class="products" id="productArea"></div>

<!-- MODAL -->

<div class="modal" id="modal">

<div class="modal-header">
<div class="close" onclick="closeModal()">✕</div>
<img id="modalImg">
</div>

<div class="modal-body">

<div class="modal-title" id="modalName"></div>
<div class="price" id="modalPrice"></div>
<div class="stock" id="modalStock"></div>

<div class="qty">
<button onclick="changeQty(-1)">−</button>
<span id="qty">1</span>
<button onclick="changeQty(1)">+</button>
</div>

<button class="cart-btn" onclick="addToCart()">In den Warenkorb</button>

<div class="desc-title" onclick="toggleDesc()">
<span>Produktbeschreibung</span>
<span>›</span>
</div>

<div class="desc-card" id="descCard">
Frisches Produkt aus kontrolliertem Anbau.
</div>

</div>
</div>

<div class="cart-bar" id="cartBar" onclick="openCart()">
<span>Bestellung anzeigen</span>
<div class="count" id="cartCount">0</div>
</div>

<div class="cart-screen" id="cartScreen">

<h2>Warenkorb</h2>

<div id="cartItems"></div>

<input id="customerName" placeholder="Ihr Name" style="width:100%;padding:12px;border-radius:10px;border:1px solid #ddd;margin-top:15px">

<button class="cart-btn" onclick="sendOrder()">WhatsApp Bestellung senden</button>

</div>

<div class="admin" onclick="adminAdd()">Admin +</div>

<script>

/* ZOOM LOCK */

document.addEventListener('gesturestart',e=>e.preventDefault())

/* DATA */

let products=[
{
name:"Granatapfel",
price:"€8,99/kg",
stock:50,
img:"https://i.postimg.cc/FsBpQQqr/Adsiz-tasarim.png"
}
]

let cart=[]
let qty=1
let currentProduct=null

/* RENDER PRODUCTS */

function renderProducts(){

productArea.innerHTML=""

products.forEach((p,i)=>{

let div=document.createElement("div")

div.className="card product"

div.dataset.name=p.name

div.innerHTML=`

<img src="${p.img}" onclick="openModal(${i})">

<div class="name">${p.name}</div>

<div class="price">${p.price}</div>

`

productArea.appendChild(div)

})

}

renderProducts()

/* CATEGORY */

function openCategory(){

categories.style.display="none"
logoArea.style.display="none"
productArea.style.display="block"
backBtn.style.display="block"

}

function goBack(){

categories.style.display="grid"
logoArea.style.display="block"
productArea.style.display="none"
backBtn.style.display="none"

}

/* MODAL */

function openModal(i){

let p=products[i]

currentProduct=i

modal.classList.add("active")

modalImg.src=p.img

modalName.innerText=p.name

modalPrice.innerText=p.price

modalStock.innerText="Stock: "+p.stock

}

function closeModal(){

modal.classList.remove("active")

}

/* QTY */

function changeQty(v){

qty+=v

if(qty<1)qty=1

qty.innerText=qty

}

/* CART */

function addToCart(){

let p=products[currentProduct]

cart.push({
name:p.name,
qty:qty
})

cartCount.innerText=cart.length

cartBar.classList.add("active")

renderCart()

closeModal()

}

function renderCart(){

cartItems.innerHTML=""

cart.forEach((item,i)=>{

let div=document.createElement("div")

div.className="cart-item"

div.innerHTML=`
${item.qty} x ${item.name}
<span onclick="removeItem(${i})">❌</span>
`

cartItems.appendChild(div)

})

}

function removeItem(i){

cart.splice(i,1)

cartCount.innerText=cart.length

renderCart()

}

/* CART SCREEN */

function openCart(){

cartScreen.classList.add("active")

}

/* SEARCH */

function searchProducts(q){

q=q.toLowerCase()

document.querySelectorAll(".product").forEach(p=>{

p.style.display=
p.dataset.name.toLowerCase().includes(q)?"block":"none"

})

}

/* WHATSAPP */

function sendOrder(){

let name=document.getElementById("customerName").value

let msg="Bestellung von "+name+"%0A%0A"

cart.forEach(i=>{

msg+=i.qty+" x "+i.name+"%0A"

})

window.open("https://wa.me/491727117489?text="+msg)

}

/* ADMIN */

function adminAdd(){

let name=prompt("Produktname")

let price=prompt("Preis")

let stock=prompt("Stock")

let img=prompt("Bild URL")

products.push({
name,
price,
stock,
img
})

renderProducts()

}

</script>

</body>
</html>
