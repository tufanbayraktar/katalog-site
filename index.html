<!DOCTYPE html>

<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>FreshMaximum</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>

*{box-sizing:border-box}

body{
margin:0;
font-family:'Inter',sans-serif;
background:#f4f6f8
}

/* TOP */

.topbar{
display:flex;
gap:10px;
padding:15px;
}

.search{
flex:1;
height:45px;
border-radius:25px;
border:none;
padding:0 15px;
background:#e6e9ed
}

/* LOGO */

.logo-area{
text-align:center;
padding:25px
}

.logo-card{
background:white;
display:inline-block;
padding:25px;
border-radius:25px;
box-shadow:0 8px 20px rgba(0,0,0,0.08)
}

.logo-card img{
height:90px
}

.brand{
font-size:28px;
font-weight:700;
margin-top:10px
}

/* CATEGORIES */

.categories{
padding:20px;
display:grid;
grid-template-columns:1fr 1fr;
gap:15px
}

.cat{
background:white;
border-radius:20px;
padding:10px;
box-shadow:0 8px 20px rgba(0,0,0,0.08);
cursor:pointer
}

.cat img{
width:100%;
height:120px;
object-fit:cover;
border-radius:15px
}

.cat-title{
text-align:center;
font-weight:600;
margin-top:8px
}

/* PRODUCTS */

.products{
display:none;
padding:20px
}

.card{
background:white;
border-radius:20px;
padding:15px;
box-shadow:0 8px 20px rgba(0,0,0,0.08);
margin-bottom:20px
}

.card img{
width:100%;
border-radius:15px
}

.name{
text-align:center;
font-size:20px;
font-weight:700;
margin-top:10px
}

.price{
text-align:center;
color:#16a34a;
font-weight:700
}

/* CART */

.cart-bar{
position:fixed;
bottom:-100px;
left:20px;
right:20px;
background:#16a34a;
color:white;
padding:15px;
border-radius:20px;
display:flex;
justify-content:space-between;
transition:0.4s
}

.cart-bar.active{
bottom:20px
}

.count{
background:white;
color:#16a34a;
width:28px;
height:28px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center
}

/* CART SCREEN */

.cart-screen{
position:fixed;
inset:0;
background:white;
transform:translateY(100%);
transition:0.4s;
z-index:1000;
padding:20px;
overflow:auto
}

.cart-screen.active{
transform:translateY(0)
}

.cart-item{
background:#f4f6f8;
padding:15px;
border-radius:12px;
margin-bottom:10px;
display:flex;
justify-content:space-between
}

/* ADMIN */

.admin-btn{
position:fixed;
right:10px;
bottom:120px;
background:black;
color:white;
padding:10px;
border-radius:10px;
cursor:pointer
}

/* PANEL */

.panel{
position:fixed;
inset:0;
background:white;
transform:translateY(100%);
transition:0.4s;
z-index:2000;
padding:20px;
overflow:auto
}

.panel.active{
transform:translateY(0)
}

input,select{
width:100%;
padding:10px;
margin-bottom:10px;
border-radius:8px;
border:1px solid #ddd
}

button{
padding:12px;
border:none;
border-radius:10px;
background:#16a34a;
color:white
}

.stat{
background:#f4f6f8;
padding:10px;
border-radius:10px;
margin-top:10px
}

</style>

</head>

<body>

<div class="topbar">
<input class="search" placeholder="Suchen" onkeyup="searchProducts(this.value)">
</div>

<div class="logo-area">

<div class="logo-card">
<img src="https://i.postimg.cc/qMnCrzdm/Fresh-Maximum-Logo.png">
</div>

<div class="brand">FreshMaximum</div>

</div>

<div class="categories" id="categories">

<div class="cat" onclick="openCategory('Obst')">
<img src="https://i.postimg.cc/tTCc6sjr/Ekran-goruntusu-2026-02-20-165607.png">
<div class="cat-title">Obst</div>
</div>

<div class="cat" onclick="openCategory('Gemüse')">
<img src="https://i.postimg.cc/MHBg6hxj/Ekran-goruntusu-2026-02-20-165736.png">
<div class="cat-title">Gemüse</div>
</div>

</div>

<div class="products" id="productArea"></div>

<div class="cart-bar" id="cartBar" onclick="openCart()">
<span>Bestellung anzeigen</span>
<div class="count" id="cartCount">0</div>
</div>

<div class="cart-screen" id="cartScreen">

<h2>Warenkorb</h2>

<div id="cartItems"></div>

<input id="customerName" placeholder="Ihr Name">

<h3 id="totalPrice">Total: 0 €</h3>

<button onclick="sendOrder()">WhatsApp Bestellung senden</button>

</div>

<div class="admin-btn" onclick="adminLogin()">ADMIN</div>

<div class="panel" id="adminPanel">

<h2>Produkt hinzufügen</h2>

<input id="pname" placeholder="Produktname">
<input id="pprice" placeholder="Preis €">
<input id="pstock" placeholder="Stock">

<select id="pcat">
<option value="Obst">Obst</option>
<option value="Gemüse">Gemüse</option>
</select>

<input type="file" id="pimg">

<button onclick="saveProduct()">Produkt speichern</button>

<h3>Statistik</h3>

<div class="stat" id="totalOrders"></div>
<div class="stat" id="totalRevenue"></div>

</div>

<script>

/* DATA */

let products=JSON.parse(localStorage.getItem("products"))||[]
let orders=JSON.parse(localStorage.getItem("orders"))||[]

let cart=[]
let currentCategory=null

function saveDB(){
localStorage.setItem("products",JSON.stringify(products))
localStorage.setItem("orders",JSON.stringify(orders))
}

function openCategory(cat){

currentCategory=cat

categories.style.display="none"
productArea.style.display="block"

renderProducts()

}

function renderProducts(){

productArea.innerHTML=""

products
.filter(p=>p.category===currentCategory)
.forEach((p,i)=>{

let div=document.createElement("div")

div.className="card"

div.innerHTML=`

<img src="${p.img}">

<div class="name">${p.name}</div>

<div class="price">${p.price} €</div>

<button onclick="addToCart(${i})">+</button>

`

productArea.appendChild(div)

})

}

function searchProducts(q){

q=q.toLowerCase()

document.querySelectorAll(".card").forEach(p=>{
p.style.display=p.innerText.toLowerCase().includes(q)?"block":"none"
})

}

function addToCart(i){

cart.push(products[i])

cartCount.innerText=cart.length
cartBar.classList.add("active")

renderCart()

}

function renderCart(){

cartItems.innerHTML=""

let total=0

cart.forEach((item,i)=>{

total+=parseFloat(item.price)

let div=document.createElement("div")

div.className="cart-item"

div.innerHTML=`
${item.name} - ${item.price} €
<span onclick="removeItem(${i})">❌</span>
`

cartItems.appendChild(div)

})

document.getElementById("totalPrice").innerText="Total: "+total+" €"

}

function removeItem(i){

cart.splice(i,1)

cartCount.innerText=cart.length

renderCart()

}

function openCart(){
cartScreen.classList.add("active")
}

function sendOrder(){

let name=document.getElementById("customerName").value

let order={
customer:name,
items:cart,
date:new Date().toLocaleString()
}

orders.push(order)

saveDB()

window.open("https://wa.me/491727117489")

updateStats()

}

function adminLogin(){

let pass=prompt("Admin Passwort")

if(pass!=="1234")return

adminPanel.classList.add("active")

updateStats()

}

function saveProduct(){

let file=document.getElementById("pimg").files[0]

let reader=new FileReader()

reader.onload=function(){

products.push({
name:pname.value,
price:pprice.value,
stock:pstock.value,
category:pcat.value,
img:reader.result
})

saveDB()

}

reader.readAsDataURL(file)

}

function updateStats(){

document.getElementById("totalOrders").innerText="Bestellungen: "+orders.length

let total=0

orders.forEach(o=>{
o.items.forEach(i=>{
total+=parseFloat(i.price)
})
})

document.getElementById("totalRevenue").innerText="Umsatz: "+total+" €"

}

updateStats()

</script>

</body>
</html>
