<!DOCTYPE html>

<html lang="de">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>FreshMaximum</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>

*{box-sizing:border-box}

body{
margin:0;
font-family:Inter;
background:#f6f7f9;
overflow-x:hidden;
}

/* HERO */

.hero{
position:relative;
height:220px;
overflow:hidden;
}

.hero img{
width:100%;
height:100%;
object-fit:cover;
}

/* SEARCH */

.searchbar{
position:absolute;
top:18px;
left:50%;
transform:translateX(-50%);
width:80%;
height:46px;
background:rgba(0,0,0,0.6);
border-radius:30px;
display:flex;
align-items:center;
padding:0 16px;
color:white;
}

.searchbar input{
border:none;
background:none;
color:white;
font-size:16px;
outline:none;
width:100%;
text-align:center;
}

/* LOGO */

.logo-section{
text-align:center;
margin-top:-60px;
}

.logo{
width:110px;
height:110px;
background:white;
border-radius:22px;
display:flex;
align-items:center;
justify-content:center;
margin:auto;
box-shadow:0 10px 30px rgba(0,0,0,0.25);
}

.logo img{
width:80px;
}

.brand{
font-size:26px;
font-weight:700;
margin-top:10px;
}

/* CATEGORY */

.categories{
margin-top:30px;
display:grid;
grid-template-columns:1fr 1fr;
gap:16px;
padding:16px;
}

.cat{
background:white;
border-radius:18px;
overflow:hidden;
box-shadow:0 6px 12px rgba(0,0,0,0.08);
cursor:pointer;
}

.cat img{
width:100%;
height:150px;
object-fit:cover;
}

.catname{
padding:12px;
text-align:center;
font-weight:600;
font-size:18px;
}

/* PRODUCTS */

.products{
display:none;
grid-template-columns:1fr 1fr;
gap:14px;
padding:16px;
}

.card{
background:white;
border-radius:16px;
padding:10px;
box-shadow:0 6px 12px rgba(0,0,0,0.08);
position:relative;
}

.card img{
width:100%;
height:150px;
border-radius:12px;
object-fit:cover;
cursor:pointer;
}

.name{
text-align:center;
font-weight:700;
margin-top:8px;
font-size:18px;
}

.price{
text-align:center;
color:#16a34a;
font-weight:700;
}

/* ADD BUTTON */

.addbtn{
position:absolute;
right:10px;
bottom:10px;
width:38px;
height:38px;
border:none;
border-radius:50%;
background:#16a34a;
color:white;
font-size:22px;
cursor:pointer;
transition:0.2s;
}

.addbtn:active{
transform:scale(1.3);
}

/* COUNTER */

.counter{
position:absolute;
right:10px;
bottom:10px;
display:flex;
align-items:center;
gap:6px;
background:#16a34a;
padding:4px 8px;
border-radius:20px;
color:white;
}

.counter button{
background:white;
border:none;
width:24px;
height:24px;
border-radius:50%;
font-weight:bold;
}

/* DETAIL */

.detail{
position:fixed;
inset:0;
background:white;
transform:translateY(100%);
transition:0.35s;
padding:20px;
z-index:100;
overflow:auto;
}

.detail.active{
transform:translateY(0);
}

.detail img{
width:100%;
border-radius:18px;
}

.cta{
width:100%;
padding:16px;
margin-top:16px;
background:#16a34a;
border:none;
border-radius:12px;
color:white;
}

/* CART */

.viewcart{
position:fixed;
bottom:12px;
left:12px;
right:12px;
background:#16a34a;
color:white;
padding:14px;
border-radius:14px;
text-align:center;
display:none;
cursor:pointer;
}

.cartpanel{
position:fixed;
inset:0;
background:white;
transform:translateY(100%);
transition:0.35s;
padding:20px;
z-index:200;
}

.cartpanel.active{
transform:translateY(0);
}

.cartitem{
display:flex;
justify-content:space-between;
align-items:center;
background:#f3f3f3;
padding:12px;
border-radius:10px;
margin-bottom:12px;
}

.qty button{
width:30px;
height:30px;
border:none;
background:#16a34a;
color:white;
border-radius:6px;
}

</style>

</head>

<body>

<div class="hero">

<img src="https://i.postimg.cc/bJB4bPp8/IMG-3971.jpg">

<div class="searchbar">
<input id="searchInput" type="text" placeholder="🔍 Suchen" oninput="searchProducts()">
</div>

</div>

<div class="logo-section">

<div class="logo">
<img src="https://i.postimg.cc/qMnCrzdm/Fresh-Maximum-Logo.png">
</div>

<div class="brand">Fresh Maximum</div>

</div>

<div class="categories" id="categories">

<div class="cat" onclick="openCategory('Obst')">
<img src="https://i.postimg.cc/tTCc6sjr/Ekran-goruntusu-2026-02-20-165607.png">
<div class="catname">Obst</div>
</div>

<div class="cat" onclick="openCategory('Gemüse')">
<img src="https://i.postimg.cc/MHBg6hxj/Ekran-goruntusu-2026-02-20-165736.png">
<div class="catname">Gemüse</div>
</div>

</div>

<div class="products" id="productList"></div>

<div class="detail" id="detail"></div>

<div class="viewcart" id="viewcart" onclick="openCart()">
Sepeti görüntüle
</div>

<div class="cartpanel" id="cartpanel">

<h2>Ihr Warenkorb</h2>

<div id="cartitems"></div>

<button onclick="sendOrder()">WhatsApp Bestellung senden</button>

</div>

<script>

let products=[

{
name:"Granatäpfel",
price:"€ / kg",
category:"Obst",
img:"https://i.postimg.cc/FsBpQQqr/Adsiz-tasarim.png"
},

{
name:"Apfel",
price:"€ / kg",
category:"Obst",
img:"https://i.postimg.cc/Vkq7yq8R/apple.jpg"
}

]

let cart={}

/* CATEGORY */

function openCategory(cat){

categories.style.display="none"

let list=document.getElementById("productList")

list.style.display="grid"

list.innerHTML=""

products.filter(p=>p.category===cat).forEach(p=>{

list.innerHTML+=`

<div class="card">

<img onclick="openDetail('${p.name}','${p.img}','${p.price}')" src="${p.img}">

<div class="name">${p.name}</div>

<div class="price">${p.price}</div>

<button class="addbtn" onclick="event.stopPropagation(); addCart('${p.name}')">+</button>

<div id="counter-${p.name}" class="counter" style="display:none">

<button onclick="changeQty('${p.name}',-1)">-</button>

<span id="qty-${p.name}">0</span>

<button onclick="changeQty('${p.name}',1)">+</button>

</div>

</div>

`

})

}

/* DETAIL */

function openDetail(name,img,price){

detail.innerHTML=`

<img src="${img}">

<h2>${name}</h2>

<p>${price}</p>

<button class="cta" onclick="addCart('${name}')">In den Warenkorb</button>

<button onclick="closeDetail()">Schließen</button>

`

detail.classList.add("active")

}

function closeDetail(){
detail.classList.remove("active")
}

/* SEARCH */

function searchProducts(){

let input=document.getElementById("searchInput").value.toLowerCase()

document.querySelectorAll(".card").forEach(p=>{

let name=p.innerText.toLowerCase()

p.style.display=name.includes(input)?"block":"none"

})

}

/* CART */

function addCart(name){

if(!cart[name]) cart[name]=0

cart[name]++

viewcart.style.display="block"

updateCounter(name)

renderCart()

}

function changeQty(name,val){

cart[name]+=val

if(cart[name]<=0){

delete cart[name]

document.getElementById("counter-"+name).style.display="none"

}else{

updateCounter(name)

}

renderCart()

}

function updateCounter(name){

document.getElementById("counter-"+name).style.display="flex"

document.getElementById("qty-"+name).innerText=cart[name]

}

function renderCart(){

cartitems.innerHTML=""

for(let item in cart){

cartitems.innerHTML+=`

<div class="cartitem">

${item}

<div class="qty">

<button onclick="changeQty('${item}',-1)">-</button>

<span>${cart[item]}</span>

<button onclick="changeQty('${item}',1)">+</button>

</div>

</div>

`

}

}

function openCart(){

cartpanel.classList.add("active")

}

/* ORDER */

function sendOrder(){

let msg="FreshMaximum Bestellung:%0A"

for(let item in cart){

msg+=item+" x"+cart[item]+"%0A"

}

window.open("https://wa.me/491727117489?text="+msg)

}

</script>

</body>
</html>
