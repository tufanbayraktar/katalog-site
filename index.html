<!DOCTYPE html>

<html lang="de">

<head>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>FreshMaximum</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Inter;
background:#f6f7f9;
overflow-x:hidden;
touch-action:manipulation;
}

/* HEADER */

.header{
background:black;
color:#16a34a;
padding:16px;
text-align:center;
font-size:24px;
font-weight:700
}

/* LOGO */

.logo{
text-align:center;
background:white;
padding:10px
}

.logo img{
height:70px
}

/* CATEGORY GRID */

.categories{
display:grid;
grid-template-columns:1fr 1fr;
gap:14px;
padding:14px
}

.cat{
background:white;
border-radius:16px;
overflow:hidden;
box-shadow:0 4px 8px rgba(0,0,0,0.08);
cursor:pointer
}

.cat img{
width:100%;
height:140px;
object-fit:cover
}

.catname{
padding:10px;
font-weight:700;
text-align:center;
font-size:18px
}

</style>

</head>

<body>

<div class="header">
Fresh Maximum
</div>

<div class="logo">
<img src="https://i.postimg.cc/qMnCrzdm/Fresh-Maximum-Logo.png">
</div>

<div class="categories">

<div class="cat">

<img src="https://i.postimg.cc/tTCc6sjr/Ekran-goruntusu-2026-02-20-165607.png">

<div class="catname">
Obst
</div>

</div>

<div class="cat">

<img src="https://i.postimg.cc/MHBg6hxj/Ekran-goruntusu-2026-02-20-165736.png">

<div class="catname">
Gemüse
</div>

</div>

</div>

<script>

/* ZOOM ENGELLE */

document.addEventListener("gesturestart", e=>e.preventDefault())

</script>

</body>

</html>
