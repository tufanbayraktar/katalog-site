<!DOCTYPE html>

<html lang="de">

<head>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>FreshMaximum</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Inter;
background:#f6f7f9;
overflow-x:hidden;
touch-action:manipulation;
}

/* HEADER */

.header{
background:black;
color:#16a34a;
padding:16px;
text-align:center;
font-size:24px;
font-weight:700
}

/* LOGO */

.logo{
text-align:center;
background:white;
padding:10px
}

.logo img{
height:70px
}

/* SEARCH */

.searchbar{
padding:10px;
background:white
}

.searchbar input{
width:100%;
padding:12px;
border-radius:10px;
border:none;
background:#eef0f2
}

/* GRID */

.products{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
padding:12px
}

.card{
background:white;
border-radius:16px;
padding:10px;
box-shadow:0 4px 8px rgba(0,0,0,0.08);
position:relative
}

.card img{
width:100%;
height:120px;
border-radius:12px;
object-fit:cover
}

.name{
font-weight:700
}

.brand{
font-size:13px;
color:#555
}

.price{
color:#16a34a;
font-weight:700
}

.add{
position:absolute;
bottom:10px;
right:10px;
background:#16a34a;
color:white;
border:none;
width:32px;
height:32px;
border-radius:50%
}

/* DETAIL PANEL */

.detail{
position:fixed;
inset:0;
background:white;
transform:translateY(100%);
transition:0.3s;
overflow:auto;
padding:20px;
z-index:100
}

.detail.active{
transform:translateY(0)
}

/* CART */

.cartbar{
position:fixed;
bottom:-70px;
left:10px;
right:10px;
background:#16a34a;
color:white;
padding:14px;
border-radius:14px;
display:flex;
justify-content:space-between;
transition:0.3s
}

.cartbar.active{
bottom:10px
}

.cartpanel{
position:fixed;
inset:0;
background:white;
transform:translateY(100%);
transition:0.3s;
overflow:auto;
padding:20px;
z-index:101
}

.cartpanel.active{
transform:translateY(0)
}

.cartitem{
display:flex;
justify-content:space-between;
align-items:center;
padding:10px;
background:#f2f2f2;
border-radius:8px;
margin-bottom:8px
}

.qty button{
width:26px;
height:26px;
border:none;
background:#16a34a;
color:white;
border-radius:6px
}

button{
cursor:pointer
}

</style>

</head>

<body>

<div class="header">
Fresh Maximum
</div>

<div class="logo">
<img src="https://i.postimg.cc/qMnCrzdm/Fresh-Maximum-Logo.png">
</div>

<div class="searchbar">
<input placeholder="Suchen..." onkeyup="searchProducts(this.value)">
</div>

<div class="products" id="productList"></div>

<div class="cartbar" id="cartbar" onclick="openCart()">
<span>Warenkorb</span>
<span id="cartcount">0</span>
</div>

<div class="cartpanel" id="cartpanel">

<h2>Ihr Warenkorb</h2>

<div id="cartitems"></div>

<h3 id="total">Total: 0 €</h3>

<button onclick="sendOrder()">WhatsApp Bestellung</button>

</div>

<div class="detail" id="detail"></div>

<script>

/* ZOOM ENGELLE */

document.addEventListener("gesturestart", e=>e.preventDefault())

/* DATA */

let products=[]
let cart=[]

/* DEMO PRODUCTS */

products=[
{
name:"Granatapfel",
brand:"Fresh",
price:3.99,
img:"https://i.postimg.cc/FsBpQQqr/Adsiz-tasarim.png",
desc:"Frischer Granatapfel"
},
{
name:"Avocado",
brand:"Premium",
price:2.49,
img:"https://i.postimg.cc/qqQFqG0v/avocado.jpg",
desc:"Reife Avocado"
}
]

/* RENDER */

function render(){

productList.innerHTML=""

products.forEach((p,i)=>{

let div=document.createElement("div")

div.className="card"

div.innerHTML=`

<img src="${p.img}" onclick="openDetail(${i})">

<div class="name">${p.name}</div>

<div class="brand">${p.brand}</div>

<div class="price">${p.price} €</div>

<button class="add" onclick="addCart(${i})">+</button>

`

productList.appendChild(div)

})

}

/* DETAIL */

function openDetail(i){

let p=products[i]

detail.innerHTML=`

<h2>${p.name}</h2>

<img src="${p.img}" style="width:100%;border-radius:12px">

<p><b>Marke:</b> ${p.brand}</p>

<p>${p.desc}</p>

<button onclick="addCart(${i})">In den Warenkorb</button>

<button onclick="closeDetail()">Schließen</button>

`

detail.classList.add("active")

}

function closeDetail(){

detail.classList.remove("active")

}

/* SEARCH */

function searchProducts(q){

q=q.toLowerCase()

document.querySelectorAll(".card").forEach(c=>{
c.style.display=c.innerText.toLowerCase().includes(q)?"block":"none"
})

}

/* CART */

function addCart(i){

let item=cart.find(c=>c.index===i)

if(item){
item.qty++
}else{
cart.push({index:i,qty:1})
}

cartcount.innerText=cart.length

cartbar.classList.add("active")

renderCart()

}

function renderCart(){

cartitems.innerHTML=""

let total=0

cart.forEach((c,i)=>{

let p=products[c.index]

total+=p.price*c.qty

let div=document.createElement("div")

div.className="cartitem"

div.innerHTML=`
${p.name}

<div class="qty">
<button onclick="changeQty(${i},-1)">-</button>
${c.qty}
<button onclick="changeQty(${i},1)">+</button>
</div>
`

cartitems.appendChild(div)

})

document.getElementById("total").innerText="Total: "+total+" €"

}

function changeQty(i,v){

cart[i].qty+=v

if(cart[i].qty<=0) cart.splice(i,1)

renderCart()

}

function openCart(){

cartpanel.classList.add("active")

}

/* ORDER */

function sendOrder(){

let msg="FreshMaximum Bestellung:%0A"

cart.forEach(c=>{
let p=products[c.index]
msg+=p.name+" x"+c.qty+"%0A"
})

window.open("https://wa.me/491727117489?text="+msg)

}

render()

</script>

</body>

</html>
