<!DOCTYPE html>

<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>FreshMaximum</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

<style>

*{box-sizing:border-box}

body{
margin:0;
font-family:'Inter',sans-serif;
background:#f4f6f8;
overflow-x:hidden;
}

/* TOP */

.topbar{
display:flex;
gap:10px;
padding:15px;
align-items:center;
}

.back{
font-size:22px;
display:none;
cursor:pointer;
}

.search{
flex:1;
height:45px;
border-radius:25px;
border:none;
padding:0 15px;
background:#e6e9ed;
}

/* LOGO */

.logo-area{
text-align:center;
padding:25px;
}

.logo-card{
background:white;
display:inline-block;
padding:25px;
border-radius:25px;
box-shadow:0 8px 20px rgba(0,0,0,0.08);
}

.logo-card img{
height:100px;
}

.brand{
font-size:28px;
font-weight:700;
margin-top:10px;
}

/* CATEGORIES */

.categories{
padding:20px;
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
}

.cat{
background:white;
border-radius:20px;
padding:10px;
box-shadow:0 8px 20px rgba(0,0,0,0.08);
cursor:pointer;
}

.cat img{
width:100%;
height:120px;
object-fit:cover;
border-radius:15px;
}

.cat-title{
text-align:center;
font-weight:600;
margin-top:8px;
}

/* PRODUCTS */

.products{
display:none;
padding:20px;
}

.card{
background:white;
border-radius:20px;
padding:15px;
box-shadow:0 8px 20px rgba(0,0,0,0.08);
margin-bottom:20px;
}

.card img{
width:100%;
border-radius:15px;
}

.name{
text-align:center;
font-size:22px;
font-weight:700;
margin-top:10px;
}

.price{
text-align:center;
color:#16a34a;
font-weight:700;
}

/* CART */

.cart-bar{
position:fixed;
bottom:-100px;
left:20px;
right:20px;
background:#16a34a;
color:white;
padding:15px;
border-radius:20px;
display:flex;
justify-content:space-between;
transition:0.4s;
}

.cart-bar.active{
bottom:20px;
}

.count{
background:white;
color:#16a34a;
width:28px;
height:28px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
}

/* ADMIN */

.admin-btn{
position:fixed;
right:10px;
bottom:120px;
background:black;
color:white;
padding:10px;
border-radius:10px;
cursor:pointer;
}

/* PANEL */

.panel{
position:fixed;
inset:0;
background:white;
transform:translateY(100%);
transition:0.4s;
z-index:2000;
overflow:auto;
padding:20px;
}

.panel.active{
transform:translateY(0);
}

input{
width:100%;
padding:10px;
margin-bottom:10px;
border-radius:8px;
border:1px solid #ddd;
}

button{
padding:12px;
border:none;
border-radius:10px;
background:#16a34a;
color:white;
}

</style>

</head>

<body>

<div class="topbar">
<div class="back" id="backBtn" onclick="goBack()">←</div>
<input class="search" placeholder="Suchen" onkeyup="searchProducts(this.value)">
</div>

<div class="logo-area" id="logoArea">
<div class="logo-card">
<img src="https://i.postimg.cc/qMnCrzdm/Fresh-Maximum-Logo.png">
</div>
<div class="brand">FreshMaximum</div>
</div>

<div class="categories" id="categories">

<div class="cat" onclick="openCategory('Obst')">
<img src="https://i.postimg.cc/tTCc6sjr/Ekran-goruntusu-2026-02-20-165607.png">
<div class="cat-title">Obst</div>
</div>

<div class="cat" onclick="openCategory('Gemüse')">
<img src="https://i.postimg.cc/MHBg6hxj/Ekran-goruntusu-2026-02-20-165736.png">
<div class="cat-title">Gemüse</div>
</div>

</div>

<div class="products" id="productArea"></div>

<div class="cart-bar" id="cartBar">
<span>Bestellung anzeigen</span>
<div class="count" id="cartCount">0</div>
</div>

<div class="admin-btn" onclick="adminLogin()">ADMIN</div>

<div class="panel" id="adminPanel">

<h2>Admin Panel</h2>

<input id="pname" placeholder="Produktname">
<input id="pprice" placeholder="Preis €/kg">
<input id="pstock" placeholder="Stock">
<input id="pcat" placeholder="Kategorie (Obst/Gemüse)">
<input type="file" id="pimg">

<button onclick="saveProduct()">Produkt speichern</button>

<h3>Produkte</h3>

<div id="adminProducts"></div>

</div>

<script>

let products=JSON.parse(localStorage.getItem("products"))||[]

let cart=[]
let currentCategory=null

function saveDB(){
localStorage.setItem("products",JSON.stringify(products))
}

function renderProducts(){

productArea.innerHTML=""

products
.filter(p=>p.category===currentCategory)
.forEach((p,i)=>{

let div=document.createElement("div")

div.className="card"

div.innerHTML=`

<img src="${p.img}">

<div class="name">${p.name}</div>

<div class="price">${p.price}</div>

`

productArea.appendChild(div)

})

}

function openCategory(cat){

currentCategory=cat

categories.style.display="none"
logoArea.style.display="none"
productArea.style.display="block"
backBtn.style.display="block"

renderProducts()

}

function goBack(){

categories.style.display="grid"
logoArea.style.display="block"
productArea.style.display="none"
backBtn.style.display="none"

}

function searchProducts(q){

q=q.toLowerCase()

document.querySelectorAll(".card").forEach(p=>{
p.style.display=p.innerText.toLowerCase().includes(q)?"block":"none"
})

}

function adminLogin(){

let pass=prompt("Admin Passwort")

if(pass!=="1234")return

adminPanel.classList.add("active")

renderAdmin()

}

function renderAdmin(){

adminProducts.innerHTML=""

products.forEach((p,i)=>{

let div=document.createElement("div")

div.innerHTML=`
${p.name}
<button onclick="editProduct(${i})">edit</button>
<button onclick="deleteProduct(${i})">delete</button>
`

adminProducts.appendChild(div)

})

}

function saveProduct(){

let file=document.getElementById("pimg").files[0]

let reader=new FileReader()

reader.onload=function(){

products.push({

name:pname.value,
price:pprice.value,
stock:pstock.value,
category:pcat.value,
img:reader.result

})

saveDB()

renderAdmin()

}

reader.readAsDataURL(file)

}

function deleteProduct(i){

products.splice(i,1)

saveDB()

renderAdmin()

}

function editProduct(i){

let p=products[i]

p.name=prompt("Name",p.name)
p.price=prompt("Preis",p.price)
p.stock=prompt("Stock",p.stock)

saveDB()

renderAdmin()

}

new Sortable(productArea,{
animation:150
})

</script>

</body>
</html>
