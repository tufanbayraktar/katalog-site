<!DOCTYPE html>

<html lang="de">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>FreshMaximum</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<!-- Charts -->

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- PDF -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Inter',sans-serif;background:#f4f6f8}

/* TOP */
.topbar{display:flex;gap:10px;padding:15px;align-items:center}
.search{flex:1;height:45px;border-radius:25px;border:none;padding:0 15px;background:#e6e9ed}
.lang{margin-left:5px}

/* LOGIN */
.login{padding:20px}
.login input{width:100%;padding:10px;margin-bottom:10px;border-radius:8px;border:1px solid #ddd}

/* LOGO */
.logo-area{text-align:center;padding:25px}
.logo-card{background:white;display:inline-block;padding:25px;border-radius:25px;box-shadow:0 8px 20px rgba(0,0,0,0.08)}
.logo-card img{height:90px}
.brand{font-size:28px;font-weight:700;margin-top:10px}

/* CATEGORIES */
.categories{padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:15px}
.cat{background:white;border-radius:20px;padding:10px;box-shadow:0 8px 20px rgba(0,0,0,0.08);cursor:pointer}
.cat img{width:100%;height:120px;object-fit:cover;border-radius:15px}
.cat-title{text-align:center;font-weight:600;margin-top:8px}

/* PRODUCTS */
.products{display:none;padding:20px}
.card{background:white;border-radius:20px;padding:15px;box-shadow:0 8px 20px rgba(0,0,0,0.08);margin-bottom:20px}
.card img{width:100%;border-radius:15px}
.name{text-align:center;font-size:20px;font-weight:700;margin-top:10px}
.price{text-align:center;color:#16a34a;font-weight:700}

/* CART */
.cart-bar{position:fixed;bottom:-100px;left:20px;right:20px;background:#16a34a;color:white;padding:15px;border-radius:20px;display:flex;justify-content:space-between;transition:0.4s}
.cart-bar.active{bottom:20px}
.count{background:white;color:#16a34a;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center}

/* CART SCREEN */
.cart-screen{position:fixed;inset:0;background:white;transform:translateY(100%);transition:0.4s;z-index:1000;padding:20px;overflow:auto}
.cart-screen.active{transform:translateY(0)}
.cart-item{background:#f4f6f8;padding:15px;border-radius:12px;margin-bottom:10px;display:flex;justify-content:space-between}

/* ADMIN */
.admin-btn{position:fixed;right:10px;bottom:120px;background:black;color:white;padding:10px;border-radius:10px;cursor:pointer}

/* PANEL */
.panel{position:fixed;inset:0;background:white;transform:translateY(100%);transition:0.4s;z-index:2000;padding:20px;overflow:auto}
.panel.active{transform:translateY(0)}

input,select{width:100%;padding:10px;margin-bottom:10px;border-radius:8px;border:1px solid #ddd}
button{padding:12px;border:none;border-radius:10px;background:#16a34a;color:white;margin-top:5px}

.stat{background:#f4f6f8;padding:10px;border-radius:10px;margin-top:10px}
</style>

</head>

<body>

<div class="login" id="loginBox">
<h2>Kunde Login</h2>
<input id="custName" placeholder="Name">
<input id="custPhone" placeholder="Telefon">
<button onclick="loginCustomer()">Login</button>
</div>

<div id="mainApp" style="display:none">

<div class="topbar">
<input class="search" placeholder="Suchen" onkeyup="searchProducts(this.value)">
<select class="lang" onchange="setLang(this.value)">
<option value="de">DE</option>
<option value="tr">TR</option>
<option value="en">EN</option>
</select>
</div>

<div class="logo-area">
<div class="logo-card">
<img src="https://i.postimg.cc/qMnCrzdm/Fresh-Maximum-Logo.png">
</div>
<div class="brand">FreshMaximum</div>
</div>

<div class="categories" id="categories">

<div class="cat" onclick="openCategory('Obst')">
<img src="https://i.postimg.cc/tTCc6sjr/Ekran-goruntusu-2026-02-20-165607.png">
<div class="cat-title">Obst</div>
</div>

<div class="cat" onclick="openCategory('Gemüse')">
<img src="https://i.postimg.cc/MHBg6hxj/Ekran-goruntusu-2026-02-20-165736.png">
<div class="cat-title">Gemüse</div>
</div>

</div>

<div class="products" id="productArea"></div>

<div class="cart-bar" id="cartBar" onclick="openCart()">
<span id="cartText">Bestellung anzeigen</span>
<div class="count" id="cartCount">0</div>
</div>

<div class="cart-screen" id="cartScreen">

<h2>Warenkorb</h2>

<div id="cartItems"></div>

<h3 id="totalPrice">Total: 0 €</h3>

<button onclick="sendOrder()">WhatsApp Bestellung</button> <button onclick="downloadPDF()">PDF</button>

</div>

<div class="admin-btn" onclick="adminLogin()">ADMIN</div>

<div class="panel" id="adminPanel">

<h2>Produkt hinzufügen</h2>

<input id="pname" placeholder="Produktname">
<input id="pprice" placeholder="Preis €">
<input id="pstock" placeholder="Stock">

<select id="pcat">
<option value="Obst">Obst</option>
<option value="Gemüse">Gemüse</option>
</select>

<input type="file" id="pimg" accept="image/*" capture="environment">

<button onclick="saveProduct()">Produkt speichern</button>

<h3>Statistik</h3>

<div class="stat" id="totalOrders"></div>
<div class="stat" id="totalRevenue"></div>

<canvas id="salesChart"></canvas>

</div>

</div>

<script>

/* DATA */

let products=JSON.parse(localStorage.getItem("products"))||[]
let orders=JSON.parse(localStorage.getItem("orders"))||[]
let cart=[]
let currentCategory=null
let customer=null

function saveDB(){
localStorage.setItem("products",JSON.stringify(products))
localStorage.setItem("orders",JSON.stringify(orders))
}

/* CUSTOMER LOGIN */

function loginCustomer(){

customer={
name:custName.value,
phone:custPhone.value
}

localStorage.setItem("customer",JSON.stringify(customer))

loginBox.style.display="none"
mainApp.style.display="block"

}

/* CATEGORY */

function openCategory(cat){
currentCategory=cat
categories.style.display="none"
productArea.style.display="block"
renderProducts()
}

/* PRODUCTS */

function renderProducts(){

productArea.innerHTML=""

products
.filter(p=>p.category===currentCategory)
.forEach((p,i)=>{

let div=document.createElement("div")

div.className="card"

div.innerHTML=`

<img src="${p.img}">

<div class="name">${p.name}</div>

<div class="price">${p.price} €</div>

<button onclick="addToCart(${i})">+</button>

`

productArea.appendChild(div)

})

}

/* SEARCH */

function searchProducts(q){

q=q.toLowerCase()

document.querySelectorAll(".card").forEach(p=>{
p.style.display=p.innerText.toLowerCase().includes(q)?"block":"none"
})

}

/* CART */

function addToCart(i){

cart.push(products[i])

cartCount.innerText=cart.length
cartBar.classList.add("active")

renderCart()

}

function renderCart(){

cartItems.innerHTML=""

let total=0

cart.forEach((item,i)=>{

total+=parseFloat(item.price)

let div=document.createElement("div")

div.className="cart-item"

div.innerHTML=`
${item.name} - ${item.price} €
<span onclick="removeItem(${i})">❌</span>
`

cartItems.appendChild(div)

})

document.getElementById("totalPrice").innerText="Total: "+total+" €"

}

function removeItem(i){

cart.splice(i,1)

cartCount.innerText=cart.length

renderCart()

}

function openCart(){
cartScreen.classList.add("active")
}

/* ORDER */

function sendOrder(){

let order={
customer:customer,
items:cart,
date:new Date().toLocaleString()
}

orders.push(order)

/* STOCK AUTO */

cart.forEach(item=>{
let p=products.find(x=>x.name===item.name)
if(p) p.stock--
})

saveDB()

window.open("https://wa.me/491727117489")

updateStats()

}

/* PDF */

function downloadPDF(){

const {jsPDF}=window.jspdf

let doc=new jsPDF()

doc.text("FreshMaximum Bestellung",20,20)

cart.forEach((i,index)=>{

doc.text(i.name+" "+i.price+" €",20,40+(index*10))

})

doc.save("bestellung.pdf")

}

/* ADMIN */

function adminLogin(){

let pass=prompt("Admin Passwort")

if(pass!=="1234")return

adminPanel.classList.add("active")

updateStats()

}

/* SAVE PRODUCT */

function saveProduct(){

let file=document.getElementById("pimg").files[0]

let reader=new FileReader()

reader.onload=function(){

products.push({
name:pname.value,
price:pprice.value,
stock:pstock.value,
category:pcat.value,
img:reader.result
})

saveDB()

}

reader.readAsDataURL(file)

}

/* STATS */

function updateStats(){

document.getElementById("totalOrders").innerText="Bestellungen: "+orders.length

let total=0

let productSales={}

orders.forEach(o=>{
o.items.forEach(i=>{
total+=parseFloat(i.price)
productSales[i.name]=(productSales[i.name]||0)+1
})
})

document.getElementById("totalRevenue").innerText="Umsatz: "+total+" €"

let ctx=document.getElementById("salesChart")

new Chart(ctx,{
type:"bar",
data:{
labels:Object.keys(productSales),
datasets:[{
label:"Sales",
data:Object.values(productSales)
}]
}
})

}

/* LANGUAGE */

function setLang(l){

if(l==="tr") cartText.innerText="Sepeti Gör"
if(l==="en") cartText.innerText="View Cart"
if(l==="de") cartText.innerText="Bestellung anzeigen"

}

/* OFFLINE */

if("serviceWorker" in navigator){

const swCode=`
self.addEventListener('install',e=>self.skipWaiting());
self.addEventListener('fetch',e=>{});
`

const blob=new Blob([swCode],{type:'text/javascript'})

const swURL=URL.createObjectURL(blob)

navigator.serviceWorker.register(swURL)

}

updateStats()

</script>

</body>
</html>
