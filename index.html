<!DOCTYPE html>

<html lang="de">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>FreshMaximum</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{box-sizing:border-box}

body{
margin:0;
font-family:'Inter',sans-serif;
background:#f6f7f9
}

/* HEADER */

.header{
background:#16a34a;
color:white;
padding:18px;
font-size:22px;
font-weight:700;
text-align:center
}

.searchbar{
padding:12px;
background:white
}

.searchbar input{
width:100%;
padding:12px;
border-radius:12px;
border:none;
background:#eef0f2
}

/* CATEGORY */

.categories{
display:flex;
overflow-x:auto;
gap:10px;
padding:10px;
background:white;
position:sticky;
top:0;
z-index:5
}

.cat{
background:#f1f1f1;
padding:8px 14px;
border-radius:20px;
font-weight:600;
cursor:pointer
}

/* GRID */

.products{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
padding:12px
}

.card{
background:white;
border-radius:18px;
padding:10px;
box-shadow:0 4px 10px rgba(0,0,0,0.08);
position:relative
}

.card img{
width:100%;
border-radius:14px;
height:120px;
object-fit:cover
}

.name{
font-weight:600;
margin-top:6px
}

.price{
color:#16a34a;
font-weight:700
}

.stock{
font-size:12px
}

.lowstock{
color:red
}

.add{
position:absolute;
right:10px;
bottom:10px;
background:#16a34a;
color:white;
border:none;
width:32px;
height:32px;
border-radius:50%;
font-size:18px
}

.fav{
position:absolute;
right:10px;
top:10px;
font-size:18px;
cursor:pointer
}

/* CART */

.cartbar{
position:fixed;
bottom:-80px;
left:10px;
right:10px;
background:#16a34a;
color:white;
padding:14px;
border-radius:16px;
display:flex;
justify-content:space-between;
transition:0.3s
}

.cartbar.active{
bottom:10px
}

.count{
background:white;
color:#16a34a;
padding:3px 8px;
border-radius:10px
}

/* CART PANEL */

.cartpanel{
position:fixed;
inset:0;
background:white;
transform:translateY(100%);
transition:0.3s;
padding:20px;
overflow:auto
}

.cartpanel.active{
transform:translateY(0)
}

.cartitem{
display:flex;
justify-content:space-between;
padding:10px;
background:#f2f3f5;
border-radius:10px;
margin-bottom:8px
}

/* ADMIN */

.admin{
position:fixed;
right:10px;
bottom:100px;
background:black;
color:white;
padding:10px;
border-radius:10px
}

.panel{
position:fixed;
inset:0;
background:white;
transform:translateY(100%);
transition:0.3s;
padding:20px;
overflow:auto
}

.panel.active{
transform:translateY(0)
}

input,select{
width:100%;
padding:10px;
margin-bottom:8px;
border-radius:8px;
border:1px solid #ddd
}

button{
padding:10px;
border:none;
border-radius:10px;
background:#16a34a;
color:white
}

.delete{
background:red
}

.productrow{
display:flex;
justify-content:space-between;
margin-top:6px;
background:#f3f3f3;
padding:8px;
border-radius:8px
}

.stat{
background:#f2f2f2;
padding:10px;
border-radius:10px;
margin-top:10px
}

</style>

</head>

<body>

<div class="header">FreshMaximum</div>

<div class="searchbar">
<input placeholder="Suchen..." onkeyup="searchProducts(this.value)">
</div>

<div class="categories">
<div class="cat" onclick="filterCategory('all')">Alle</div>
<div class="cat" onclick="filterCategory('Obst')">Obst</div>
<div class="cat" onclick="filterCategory('Gemüse')">Gemüse</div>
<div class="cat" onclick="showFavorites()">Favoriten</div>
</div>

<div class="products" id="productList"></div>

<div class="cartbar" id="cartbar" onclick="openCart()">
<span>Warenkorb</span>
<span class="count" id="cartcount">0</span>
</div>

<div class="cartpanel" id="cartpanel">

<h2>Ihr Warenkorb</h2>

<div id="cartitems"></div>

<h3 id="total">Total: 0 €</h3>

<button onclick="repeatLastOrder()">Letzte Bestellung wiederholen</button>

<button onclick="sendOrder()">WhatsApp Bestellung</button>

</div>

<div class="admin" onclick="adminLogin()">ADMIN</div>

<div class="panel" id="adminpanel">

<h2>Produkt hinzufügen</h2>

<input id="pname" placeholder="Produktname">
<input id="pprice" placeholder="Preis €">
<input id="pstock" placeholder="Stock">

<select id="pcat">
<option value="Obst">Obst</option>
<option value="Gemüse">Gemüse</option>
</select>

<input type="file" id="pimg" accept="image/*" capture="environment">

<button onclick="addProduct()">Speichern</button>

<h3>Produkte</h3>

<div id="adminlist"></div>

<h3>Dashboard</h3>

<div class="stat" id="ordercount"></div>
<div class="stat" id="revenue"></div>

<canvas id="saleschart"></canvas>

</div>

<script>

let products=JSON.parse(localStorage.getItem("products"))||[]
let orders=JSON.parse(localStorage.getItem("orders"))||[]
let favorites=JSON.parse(localStorage.getItem("favorites"))||[]
let cart=[]
let current="all"

function save(){
localStorage.setItem("products",JSON.stringify(products))
localStorage.setItem("orders",JSON.stringify(orders))
localStorage.setItem("favorites",JSON.stringify(favorites))
}

/* RENDER */

function render(){

productList.innerHTML=""

products
.filter(p=>current==="all"||p.category===current)
.forEach((p,i)=>{

let fav=favorites.includes(p.name)?"❤️":"🤍"

let stockClass=p.stock<=5?"stock lowstock":"stock"

let div=document.createElement("div")

div.className="card"

div.innerHTML=`
<span class="fav" onclick="toggleFav('${p.name}')">${fav}</span>

<img src="${p.img}">

<div class="name">${p.name}</div>

<div class="price">${p.price} €</div>

<div class="${stockClass}">Stock: ${p.stock}</div>

<button class="add" onclick="addCart(${i})">+</button>
`

productList.appendChild(div)

})

renderAdmin()

}

/* FAVORITES */

function toggleFav(name){

if(favorites.includes(name)){
favorites=favorites.filter(f=>f!==name)
}else{
favorites.push(name)
}

save()
render()

}

function showFavorites(){

productList.innerHTML=""

products
.filter(p=>favorites.includes(p.name))
.forEach((p,i)=>{

let div=document.createElement("div")

div.className="card"

div.innerHTML=`
<img src="${p.img}">
<div class="name">${p.name}</div>
<div class="price">${p.price} €</div>
<button class="add" onclick="addCart(${i})">+</button>
`

productList.appendChild(div)

})

}

/* SEARCH */

function searchProducts(q){

q=q.toLowerCase()

document.querySelectorAll(".card").forEach(c=>{
c.style.display=c.innerText.toLowerCase().includes(q)?"block":"none"
})

}

/* CATEGORY */

function filterCategory(c){
current=c
render()
}

/* CART */

function addCart(i){

cart.push(products[i])

cartcount.innerText=cart.length

cartbar.classList.add("active")

renderCart()

}

function renderCart(){

cartitems.innerHTML=""

let total=0

cart.forEach((c,i)=>{

total+=parseFloat(c.price)

let div=document.createElement("div")

div.className="cartitem"

div.innerHTML=`
${c.name} - ${c.price} €
<span onclick="removeCart(${i})">❌</span>
`

cartitems.appendChild(div)

})

document.getElementById("total").innerText="Total: "+total+" €"

}

function removeCart(i){

cart.splice(i,1)

cartcount.innerText=cart.length

renderCart()

}

/* REPEAT ORDER */

function repeatLastOrder(){

if(orders.length===0)return

cart=[...orders[orders.length-1]]

cartcount.innerText=cart.length

renderCart()

}

/* CART PANEL */

function openCart(){
cartpanel.classList.add("active")
}

/* ORDER */

function sendOrder(){

orders.push([...cart])

cart.forEach(c=>{
let p=products.find(x=>x.name===c.name)
if(p) p.stock--
})

save()

let msg="FreshMaximum Bestellung:%0A"

cart.forEach(i=>{
msg+=i.name+" "+i.price+"€%0A"
})

window.open("https://wa.me/491727117489?text="+msg)

updateStats()

}

/* ADMIN */

function adminLogin(){

let pass=prompt("Admin Passwort")

if(pass!=="1234")return

adminpanel.classList.add("active")

updateStats()

}

/* ADD PRODUCT */

function addProduct(){

let file=pimg.files[0]

let reader=new FileReader()

reader.onload=function(){

products.push({
name:pname.value,
price:pprice.value,
stock:pstock.value,
category:pcat.value,
img:reader.result
})

save()
render()

}

reader.readAsDataURL(file)

}

/* DELETE PRODUCT */

function deleteProduct(i){

products.splice(i,1)

save()
render()

}

/* ADMIN LIST */

function renderAdmin(){

adminlist.innerHTML=""

products.forEach((p,i)=>{

let div=document.createElement("div")

div.className="productrow"

div.innerHTML=`
${p.name}
<button class="delete" onclick="deleteProduct(${i})">Sil</button>
`

adminlist.appendChild(div)

})

}

/* DASHBOARD */

function updateStats(){

document.getElementById("ordercount").innerText="Bestellungen: "+orders.length

let revenue=0
let sales={}

orders.forEach(o=>{
o.forEach(i=>{
revenue+=parseFloat(i.price)
sales[i.name]=(sales[i.name]||0)+1
})
})

document.getElementById("revenue").innerText="Umsatz: "+revenue+" €"

let ctx=document.getElementById("saleschart")

new Chart(ctx,{
type:"bar",
data:{
labels:Object.keys(sales),
datasets:[{
label:"Sales",
data:Object.values(sales)
}]
}
})

}

render()

</script>

</body>
</html>
