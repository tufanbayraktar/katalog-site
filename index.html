<!DOCTYPE html>

<html lang="de">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>FreshMaximum</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>

*{box-sizing:border-box}

body{
margin:0;
font-family:Inter;
background:#f6f7f9;
overflow-x:hidden;
touch-action:manipulation;
}

/* HERO */

.hero{
position:relative;
height:220px;
overflow:hidden;
}

.hero img{
width:100%;
height:100%;
object-fit:cover;
}

/* SEARCH */

.searchbar{
position:absolute;
top:18px;
left:50%;
transform:translateX(-50%);
width:80%;
height:46px;
background:rgba(0,0,0,0.6);
border-radius:30px;
display:flex;
align-items:center;
padding:0 16px;
color:white;
backdrop-filter:blur(6px);
}

.searchicon{
margin-right:10px;
}

.searchbar input{
border:none;
background:none;
color:white;
font-size:16px;
outline:none;
width:100%;
text-align:center;
}

/* LOGO */

.logo-section{
position:relative;
text-align:center;
margin-top:-60px;
z-index:5;
}

.logo{
width:110px;
height:110px;
background:white;
border-radius:22px;
display:flex;
align-items:center;
justify-content:center;
margin:auto;
box-shadow:0 10px 30px rgba(0,0,0,0.25);
}

.logo img{
width:80px;
}

.brand{
font-size:26px;
font-weight:700;
margin-top:10px;
}

/* CATEGORY */

.categories{
margin-top:30px;
display:grid;
grid-template-columns:1fr 1fr;
gap:16px;
padding:16px;
}

.cat{
background:white;
border-radius:18px;
overflow:hidden;
box-shadow:0 6px 12px rgba(0,0,0,0.08);
cursor:pointer;
}

.cat img{
width:100%;
height:150px;
object-fit:cover;
}

.catname{
padding:12px;
text-align:center;
font-weight:600;
font-size:18px;
}

/* PRODUCTS */

.products{
display:none;
grid-template-columns:1fr 1fr;
gap:14px;
padding:16px;
}

.card{
background:white;
border-radius:16px;
padding:10px;
box-shadow:0 6px 12px rgba(0,0,0,0.08);
position:relative;
cursor:pointer;
}

.card img{
width:100%;
height:150px;
border-radius:12px;
object-fit:cover;
}

.name{
text-align:center;
font-weight:700;
margin-top:8px;
font-size:18px;
}

.price{
text-align:center;
color:#16a34a;
font-weight:700;
}

.addbtn{
position:absolute;
right:10px;
bottom:10px;
width:36px;
height:36px;
border:none;
border-radius:50%;
background:#16a34a;
color:white;
font-size:20px;
cursor:pointer;
}

/* DETAIL */

.detail{
position:fixed;
inset:0;
background:white;
transform:translateY(100%);
transition:0.35s;
padding:20px;
z-index:100;
overflow:auto;
}

.detail.active{
transform:translateY(0);
}

.detail img{
width:100%;
border-radius:18px;
}

.cta{
width:100%;
padding:16px;
margin-top:16px;
background:#16a34a;
border:none;
border-radius:12px;
color:white;
font-size:16px;
}

.closebtn{
width:100%;
padding:14px;
margin-top:10px;
background:#888;
border:none;
border-radius:12px;
color:white;
}

/* CART */

.cartbar{
position:fixed;
bottom:-80px;
left:12px;
right:12px;
background:#16a34a;
color:white;
padding:14px;
border-radius:14px;
display:flex;
justify-content:space-between;
transition:0.3s;
cursor:pointer;
}

.cartbar.active{
bottom:12px;
}

/* CART PANEL */

.cartpanel{
position:fixed;
inset:0;
background:white;
transform:translateY(100%);
transition:0.35s;
padding:20px;
z-index:200;
}

.cartpanel.active{
transform:translateY(0);
}

.cartitem{
display:flex;
justify-content:space-between;
align-items:center;
background:#f3f3f3;
padding:12px;
border-radius:10px;
margin-bottom:12px;
}

.qty button{
width:30px;
height:30px;
border:none;
background:#16a34a;
color:white;
border-radius:6px;
}

.orderbtn{
margin-top:20px;
width:100%;
padding:16px;
background:#16a34a;
border:none;
border-radius:12px;
color:white;
font-size:16px;
}

</style>

</head>

<body>

<div class="hero">

<img src="https://i.postimg.cc/bJB4bPp8/IMG-3971.jpg">

<div class="searchbar">

<span class="searchicon">🔍</span>

<input id="searchInput" type="text" placeholder="Suchen" oninput="searchProducts()">

</div>

</div>

<div class="logo-section">

<div class="logo">
<img src="https://i.postimg.cc/qMnCrzdm/Fresh-Maximum-Logo.png">
</div>

<div class="brand">Fresh Maximum</div>

</div>

<div class="categories" id="categories">

<div class="cat" onclick="openCategory('Obst')">
<img src="https://i.postimg.cc/tTCc6sjr/Ekran-goruntusu-2026-02-20-165607.png">
<div class="catname">Obst</div>
</div>

<div class="cat" onclick="openCategory('Gemüse')">
<img src="https://i.postimg.cc/MHBg6hxj/Ekran-goruntusu-2026-02-20-165736.png">
<div class="catname">Gemüse</div>
</div>

</div>

<div class="products" id="productList"></div>

<div class="detail" id="detail"></div>

<div class="cartbar" id="cartbar" onclick="openCart()">
<span>Warenkorb</span>
<span id="cartcount">0</span>
</div>

<div class="cartpanel" id="cartpanel">
<h2>Ihr Warenkorb</h2>
<div id="cartitems"></div>
<button class="orderbtn" onclick="sendOrder()">WhatsApp Bestellung senden</button>
</div>

<script>

/* PRODUCTS */

let products=[

{
name:"Granatäpfel",
price:"€ / kg",
category:"Obst",
img:"https://i.postimg.cc/FsBpQQqr/Adsiz-tasarim.png"
},

{
name:"Apfel",
price:"€ / kg",
category:"Obst",
img:"https://i.postimg.cc/Vkq7yq8R/apple.jpg"
}

]

let cart=0

function openCategory(cat){

categories.style.display="none"

let list=document.getElementById("productList")

list.style.display="grid"

list.innerHTML=""

products.filter(p=>p.category===cat).forEach(p=>{

list.innerHTML+=`

<div class="card product">

<img onclick="openDetail('${p.name}','${p.img}','${p.price}')"
src="${p.img}">

<div class="name">${p.name}</div>

<div class="price">${p.price}</div>

<button class="addbtn" onclick="addCart()">+</button>

</div>

`

})

}

function openDetail(name,img,price){

detail.innerHTML=`

<img src="${img}">

<h2>${name}</h2>

<p>${price}</p>

<button class="cta" onclick="addCart()">In den Warenkorb</button>

<button class="closebtn" onclick="closeDetail()">Schließen</button>

`

detail.classList.add("active")

}

function closeDetail(){
detail.classList.remove("active")
}

function searchProducts(){

let input=document.getElementById("searchInput").value.toLowerCase()

document.querySelectorAll(".product").forEach(p=>{

let name=p.innerText.toLowerCase()

p.style.display=name.includes(input)?"block":"none"

})

}

function addCart(){

cart++

cartcount.innerText=cart

cartbar.classList.add("active")

}

function openCart(){
cartpanel.classList.add("active")
}

function sendOrder(){

let msg="FreshMaximum Bestellung x"+cart

window.open("https://wa.me/491727117489?text="+msg)

}

</script>

</body>
</html>
