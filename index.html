<!DOCTYPE html>

<html lang="de">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>FreshMaximum</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>

*{box-sizing:border-box}

body{
margin:0;
font-family:Inter;
background:#f6f7f9;
overflow-x:hidden;
touch-action:manipulation;
}

/* HERO */

.hero{
position:relative;
height:220px;
overflow:hidden;
}

.hero img{
width:100%;
height:100%;
object-fit:cover;
}

/* SEARCH */

.searchbar{
position:absolute;
top:18px;
left:50%;
transform:translateX(-50%);
width:80%;
height:46px;
background:rgba(0,0,0,0.6);
border-radius:30px;
display:flex;
align-items:center;
justify-content:center;
color:white;
backdrop-filter:blur(6px);
}

.searchbar input{
border:none;
background:none;
color:white;
font-size:16px;
outline:none;
text-align:center;
width:80%;
}

/* LOGO */

.logo-section{
position:relative;
text-align:center;
margin-top:-60px;
z-index:5;
}

.logo{
width:110px;
height:110px;
background:white;
border-radius:22px;
display:flex;
align-items:center;
justify-content:center;
margin:auto;
box-shadow:0 10px 30px rgba(0,0,0,0.25);
}

.logo img{
width:80px;
}

.brand{
font-size:26px;
font-weight:700;
margin-top:10px;
}

/* CATEGORY */

.categories{
margin-top:30px;
display:grid;
grid-template-columns:1fr 1fr;
gap:16px;
padding:16px;
}

.cat{
background:white;
border-radius:18px;
overflow:hidden;
box-shadow:0 6px 12px rgba(0,0,0,0.08);
cursor:pointer;
}

.cat img{
width:100%;
height:150px;
object-fit:cover;
}

.catname{
padding:12px;
text-align:center;
font-weight:600;
font-size:18px;
}

/* PRODUCTS */

.products{
display:none;
grid-template-columns:1fr 1fr;
gap:14px;
padding:16px;
}

.card{
background:white;
border-radius:16px;
padding:10px;
box-shadow:0 6px 12px rgba(0,0,0,0.08);
position:relative;
}

.card img{
width:100%;
height:150px;
border-radius:12px;
object-fit:cover;
}

.name{
text-align:center;
font-weight:700;
margin-top:8px;
font-size:18px;
}

.price{
text-align:center;
color:#16a34a;
font-weight:700;
}

.addbtn{
position:absolute;
right:10px;
bottom:10px;
width:36px;
height:36px;
border:none;
border-radius:50%;
background:#16a34a;
color:white;
font-size:20px;
}

/* CART */

.cartbar{
position:fixed;
bottom:-80px;
left:12px;
right:12px;
background:#16a34a;
color:white;
padding:14px;
border-radius:14px;
display:flex;
justify-content:space-between;
transition:0.3s;
cursor:pointer;
}

.cartbar.active{
bottom:12px;
}

</style>

</head>

<body>

<div class="hero">

<img src="https://i.postimg.cc/bJB4bPp8/IMG-3971.jpg">

<div class="searchbar">
<input id="searchInput" type="text" placeholder="🔍 Suchen" oninput="searchProducts()">
</div>

</div>

<div class="logo-section">

<div class="logo">
<img src="https://i.postimg.cc/qMnCrzdm/Fresh-Maximum-Logo.png">
</div>

<div class="brand">Fresh Maximum</div>

</div>

<div class="categories" id="categories">

<div class="cat" onclick="openCategory('Obst')">
<img src="https://i.postimg.cc/tTCc6sjr/Ekran-goruntusu-2026-02-20-165607.png">
<div class="catname">Obst</div>
</div>

<div class="cat" onclick="openCategory('Gemüse')">
<img src="https://i.postimg.cc/MHBg6hxj/Ekran-goruntusu-2026-02-20-165736.png">
<div class="catname">Gemüse</div>
</div>

</div>

<div class="products" id="productList"></div>

<div class="cartbar" id="cartbar">
<span>Warenkorb</span>
<span id="cartcount">0</span>
</div>

<script>

/* PRODUCTS */

let products = [

{
name:"Granatäpfel",
price:"€ / kg",
category:"Obst",
img:"https://i.postimg.cc/FsBpQQqr/Adsiz-tasarim.png"
},

{
name:"Apfel",
price:"€ / kg",
category:"Obst",
img:"https://i.postimg.cc/Vkq7yq8R/apple.jpg"
},

{
name:"Banane",
price:"€ / kg",
category:"Obst",
img:"https://i.postimg.cc/yxQ9Tz4b/banana.jpg"
},

{
name:"Tomate",
price:"€ / kg",
category:"Gemüse",
img:"https://i.postimg.cc/tJ4rXr9K/tomato.jpg"
}

]

let cart=0

/* OPEN CATEGORY */

function openCategory(cat){

categories.style.display="none"

let list=document.getElementById("productList")

list.style.display="grid"

list.innerHTML=""

products
.filter(p=>p.category===cat)
.forEach(p=>{

list.innerHTML+=`

<div class="card product">

<img src="${p.img}">

<div class="name">${p.name}</div>

<div class="price">${p.price}</div>

<button class="addbtn" onclick="addCart()">+</button>

</div>

`

})

}

/* SEARCH */

function searchProducts(){

let input=document.getElementById("searchInput").value.toLowerCase()

document.querySelectorAll(".product").forEach(p=>{

let name=p.innerText.toLowerCase()

p.style.display=name.includes(input)?"block":"none"

})

}

/* CART */

function addCart(){

cart++

cartcount.innerText=cart

cartbar.classList.add("active")

}

</script>

</body>
</html>
