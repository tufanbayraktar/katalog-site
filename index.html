<!DOCTYPE html>

<html lang="de">

<head>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>FreshMaximum</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Inter;
background:#f6f7f9;
overflow-x:hidden;
touch-action:manipulation;
}

/* HEADER */

.header{
background:#16a34a;
color:white;
padding:18px;
text-align:center;
font-size:22px;
font-weight:700
}

/* SEARCH */

.searchbar{
padding:10px;
background:white
}

.searchbar input{
width:100%;
padding:12px;
border-radius:10px;
border:none;
background:#eef0f2
}

/* CATEGORY */

.categories{
display:flex;
gap:8px;
overflow-x:auto;
padding:10px;
background:white;
position:sticky;
top:0;
z-index:5
}

.cat{
background:#f1f1f1;
padding:8px 12px;
border-radius:20px;
cursor:pointer;
font-weight:600
}

/* GRID */

.products{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
padding:12px
}

.card{
background:white;
border-radius:16px;
padding:10px;
box-shadow:0 4px 8px rgba(0,0,0,0.08);
position:relative
}

.card img{
width:100%;
height:120px;
object-fit:cover;
border-radius:12px
}

.name{
font-weight:700
}

.brand{
font-size:13px;
color:#555
}

.price{
color:#16a34a;
font-weight:700
}

.add{
position:absolute;
bottom:10px;
right:10px;
background:#16a34a;
color:white;
border:none;
width:32px;
height:32px;
border-radius:50%
}

/* CART */

.cartbar{
position:fixed;
bottom:-70px;
left:10px;
right:10px;
background:#16a34a;
color:white;
padding:14px;
border-radius:14px;
display:flex;
justify-content:space-between;
transition:0.3s
}

.cartbar.active{
bottom:10px
}

/* ADMIN */

.admin{
position:fixed;
bottom:90px;
right:10px;
background:black;
color:white;
padding:10px;
border-radius:10px
}

.panel{
position:fixed;
inset:0;
background:white;
transform:translateY(100%);
transition:0.3s;
overflow:auto;
padding:20px
}

.panel.active{
transform:translateY(0)
}

input,select,textarea{
width:100%;
padding:10px;
margin-bottom:8px;
border-radius:8px;
border:1px solid #ddd
}

button{
padding:10px;
border:none;
border-radius:10px;
background:#16a34a;
color:white
}

.delete{
background:red
}

.productrow{
display:flex;
justify-content:space-between;
background:#f2f2f2;
padding:8px;
margin-top:6px;
border-radius:8px
}

</style>

</head>

<body>

<div class="header">FreshMaximum</div>

<div class="searchbar">
<input placeholder="Suchen..." onkeyup="searchProducts(this.value)">
</div>

<div class="categories">

<div class="cat" onclick="filterCategory('all')">Alle</div>
<div class="cat" onclick="filterCategory('Obst')">Obst</div>
<div class="cat" onclick="filterCategory('Gemüse')">Gemüse</div>

</div>

<div class="products" id="productList"></div>

<div class="cartbar" id="cartbar">
<span>Warenkorb</span>
<span id="cartcount">0</span>
</div>

<div class="admin" onclick="adminLogin()">ADMIN</div>

<div class="panel" id="adminpanel">

<h2>Produkt hinzufügen</h2>

<input id="pname" placeholder="Produktname">

<input id="pbrand" placeholder="Marke">

<input id="porigin" placeholder="Herkunft">

<input id="pcontent" placeholder="Inhalt">

<textarea id="pdesc" placeholder="Beschreibung"></textarea>

<input id="pprice" placeholder="Preis €">

<input id="pstock" placeholder="Stock">

<select id="pcat">
<option value="Obst">Obst</option>
<option value="Gemüse">Gemüse</option>
</select>

<input type="file" id="pimg" accept="image/*">

<button onclick="addProduct()">Produkt speichern</button>

<h3>Produkte</h3>

<div id="adminlist"></div>

</div>

<script>

/* ZOOM ENGELLE */

document.addEventListener("gesturestart", function(e){
e.preventDefault();
});

/* DATA */

let products=JSON.parse(localStorage.getItem("products"))||[]

function save(){

localStorage.setItem("products",JSON.stringify(products))

}

/* RENDER */

function render(){

productList.innerHTML=""

products.forEach((p,i)=>{

let div=document.createElement("div")

div.className="card"

div.innerHTML=`

<img src="${p.img}">

<div class="name">${p.name}</div>

<div class="brand">${p.brand}</div>

<div class="price">${p.price} €</div>

`

productList.appendChild(div)

})

renderAdmin()

}

/* SEARCH */

function searchProducts(q){

q=q.toLowerCase()

document.querySelectorAll(".card").forEach(c=>{
c.style.display=c.innerText.toLowerCase().includes(q)?"block":"none"
})

}

/* CATEGORY */

function filterCategory(cat){

productList.innerHTML=""

products
.filter(p=>cat==="all"||p.category===cat)
.forEach((p,i)=>{

let div=document.createElement("div")

div.className="card"

div.innerHTML=`

<img src="${p.img}">

<div class="name">${p.name}</div>

<div class="brand">${p.brand}</div>

<div class="price">${p.price} €</div>

`

productList.appendChild(div)

})

}

/* ADMIN */

function adminLogin(){

let pass=prompt("Admin Passwort")

if(pass!=="1234")return

adminpanel.classList.add("active")

}

/* ADD PRODUCT */

function addProduct(){

let file=document.getElementById("pimg").files[0]

if(!file){

alert("Bitte Bild auswählen")

return

}

let reader=new FileReader()

reader.onload=function(e){

let image=e.target.result

products.push({

name:pname.value,

brand:pbrand.value,

origin:porigin.value,

content:pcontent.value,

desc:pdesc.value,

price:pprice.value,

stock:pstock.value,

category:pcat.value,

img:image

})

save()

render()

}

reader.readAsDataURL(file)

}

/* DELETE */

function deleteProduct(i){

products.splice(i,1)

save()

render()

}

/* ADMIN LIST */

function renderAdmin(){

adminlist.innerHTML=""

products.forEach((p,i)=>{

let div=document.createElement("div")

div.className="productrow"

div.innerHTML=`
${p.name}
<button class="delete" onclick="deleteProduct(${i})">Sil</button>
`

adminlist.appendChild(div)

})

}

render()

</script>

</body>

</html>
